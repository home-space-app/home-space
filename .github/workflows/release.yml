# Builds the release packages when a version tag is pushed, either by creating a GitHub release
# with a new tag in the UI or from the command line:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# - server: Docker image (server + web client) for linux/amd64 and linux/arm64, pushed to Docker
#   Hub as homespaceapp/home-space. Each platform builds on a native runner (emulating arm64 to
#   compile Rust takes hours) and is pushed by digest; server-manifest then tags the multi-arch list.
# - desktop: macOS .dmg (Apple Silicon), Windows .zip (x86_64), Linux .tar.gz, .deb, .rpm and
#   .flatpak (x86_64)
# - android: .apk
#
# All packages are attached to the GitHub release for the tag. An existing release (made in the
# UI) keeps its title and notes, and the server image line is appended to them; otherwise the
# release is created with generated notes. A tag with a suffix (v0.2.0-rc.1)
# makes a pre-release and does not move the image's `latest` tag.
#
# The APK is signed only when these repository secrets are set; otherwise the release gets an
# unsigned APK, which Android refuses to install:
#   ANDROID_KEYSTORE_BASE64   the keystore (.jks), base64-encoded: base64 -w0 release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The macOS app is not signed or notarized, so Gatekeeper asks before the first launch
# (right-click > Open, or xattr -dr com.apple.quarantine "/Applications/Home Space.app").
# The Windows .exe is not signed either, so SmartScreen warns before the first launch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  server-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: homespaceapp/home-space

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=homespaceapp/home-space,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=server-${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the per-platform images as one multi-arch image.
  server-manifest:
    needs: server-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: homespaceapp/home-space
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("homespaceapp/home-space@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "homespaceapp/home-space:$VERSION"

  desktop-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
          key: aarch64-apple-darwin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Build Home Space.app
        working-directory: clients/desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo bundle --release --features keyring --target aarch64-apple-darwin

      - name: Make the .dmg
        run: |
          app="clients/target/aarch64-apple-darwin/release/bundle/osx/Home Space.app"
          dmg="HomeSpace-${{ needs.version.outputs.version }}-macos-arm64.dmg"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Home Space" -srcfolder "$staging" -fs HFS+ -format UDZO -ov "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: ${{ env.DMG }}
          if-no-files-found: error

  desktop-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients

      - name: Build
        working-directory: clients
        run: cargo build --release --locked -p desktop --features keyring

      - name: Make the .zip
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "HomeSpace-$env:VERSION-windows-x86_64"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item clients/target/release/HomeSpace.exe, LICENSE -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "$name.zip" -Force
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: ${{ env.ZIP }}
          if-no-files-found: error

  desktop-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        working-directory: clients
        run: cargo build --release --locked -p desktop --features keyring

      - name: Make the .tar.gz
        run: |
          name="HomeSpace-${{ needs.version.outputs.version }}-linux-x86_64"
          dir="$RUNNER_TEMP/$name"
          mkdir -p "$dir"
          cp clients/target/release/HomeSpace "$dir/"
          cp clients/desktop/packaging/home-space.desktop \
             clients/desktop/packaging/home-space.png \
             clients/desktop/packaging/home-space.svg \
             LICENSE "$dir/"
          cp -R clients/desktop/packaging/icons "$dir/"
          tar -C "$RUNNER_TEMP" -czf "$name.tar.gz" "$name"

      # Both read [package.metadata.deb] / [package.metadata.generate-rpm] in desktop/Cargo.toml
      # and package the binary built above. Debian and RPM sort "~" before anything, so a
      # pre-release 1.0.0-rc.1 becomes 1.0.0~rc.1 and upgrades cleanly to 1.0.0.
      - name: Make the .deb and .rpm
        working-directory: clients
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="HomeSpace-$VERSION-linux-x86_64"
          pkg_version="${VERSION//-/\~}"
          cargo deb -p desktop --no-build --deb-version "$pkg_version-1" -o "$GITHUB_WORKSPACE/$name.deb"
          cargo generate-rpm -p desktop -s "version = \"$pkg_version\"" -o "$GITHUB_WORKSPACE/$name.rpm"
          dpkg-deb --info "$GITHUB_WORKSPACE/$name.deb"
          dpkg-deb --contents "$GITHUB_WORKSPACE/$name.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: |
            HomeSpace-*-linux-x86_64.tar.gz
            HomeSpace-*-linux-x86_64.deb
            HomeSpace-*-linux-x86_64.rpm
          if-no-files-found: error

  desktop-flatpak:
    needs: version
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the APK
        working-directory: clients/mobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          # versionCode comes from build.gradle.kts, where scripts/release.sh bumps it.
          ./gradlew :androidApp:assembleRelease \
            -Phomespace.versionName=${{ needs.version.outputs.version }}
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned=clients/mobile/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          base="HomeSpace-${{ needs.version.outputs.version }}-android"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is unsigned and cannot be installed."
            cp "$unsigned" "$base-unsigned.apk"
            echo "APK=$base-unsigned.apk" >> "$GITHUB_ENV"
            exit 0
          fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$base.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$base.apk"
          rm "$RUNNER_TEMP/release.jks"
          echo "APK=$base.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APK }}
          if-no-files-found: error

  release:
    needs: [version, server-manifest, desktop-macos, desktop-windows, desktop-linux, desktop-flatpak, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{android,desktop-*}"
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          append_body: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Server image: `docker pull homespaceapp/home-space:${{ needs.version.outputs.version }}`
          files: dist/*
