[package]
name = "vault-core"
description = "Encryption of protected folders: key wrapping, sealed names, age content."
version = "0.12.3"
edition = "2024"
license = "MIT"
publish = false

[features]
# What only the server needs: storing a folder key it keeps (password folders), and names up to
# its full 255 characters.
server = []
# A software security key (`SoftAuthenticator`) for other crates' tests.
testing = ["dep:hmac"]

[dependencies]
age = "0.12.1"
age-core = "0.12.0"
bech32 = "0.11.1"
aes-siv = "0.8.0"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
hkdf = "0.13.0"
hmac = { version = "0.13.0", optional = true }
rand = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = "1.29.0"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
hmac = "0.13.0"

# The web client: age's dependencies use getrandom 0.2, rand 0.10 uses 0.4; both need the
# browser's crypto.getRandomValues on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# The server's lint set (server/Cargo.toml): this crate is no member of a workspace to inherit it from.
[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
