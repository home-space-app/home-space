[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.3"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
db = { path = "crates/db" }
events = { path = "crates/events" }
accounts = { path = "crates/accounts" }
auth = { path = "crates/auth" }
files = { path = "crates/files" }
notifications = { path = "crates/notifications" }
search = { path = "crates/search" }
shares = { path = "crates/shares" }
api = { path = "crates/api" }
protocol = { path = "../shared/protocol", features = ["server"] }

aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1"
data-encoding = "2.11.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
inquire = "0.9.5"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
mime_guess = "2.0.5"
openidconnect = { version = "4.1.0", features = ["accept-rfc3339-timestamps"] }
rpassword = "7.5.4"
rand = "0.10.3"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
toml = "1.2.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
wiremock = "0.6.5"
zip = { version = "9.5.0", default-features = false, features = ["time"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
webauthn-rs-proto = "0.6.2"
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }

[workspace.lints.clippy]
# docs/todo/server-refactoring.md (G1): long and tangled functions are flagged; existing ones
# carry an `#[expect]` naming the finding that will fix them.
too_many_lines = "warn"
cognitive_complexity = "warn"

# webauthn-rs 0.6.2 needs crypto-glue with rsa 0.10.0, which jsonwebtoken uses too. The fix is
# on crypto-glue's main branch but not released yet (0.2.2 asks for an rsa feature 0.10.0
# dropped). Remove this once crypto-glue 0.2.3 is on crates.io.
[patch.crates-io]
crypto-glue = { git = "https://github.com/kanidm/crypto-glue", rev = "f267bc22b3f28e95672129b168200820c6beeaf6" }
