# Start the app:   HOMESPACE_JWT_SECRET=$(openssl rand -base64 48) podman compose up --build
# Add a user:      podman compose run --rm app user add <name>
# Run all tests:   podman compose run --rm test
# Try single sign-on with a local Keycloak: podman compose --profile oidc up -d keycloak
#                  (see "Single sign-on" in the README)
#
# The database password, the Keycloak administrator and the published ports (this machine
# only) are for development. On a server add compose.prod.yaml, which requires real secrets.
services:
  db:
    # A new major version cannot read the files of the one before: upgrade deliberately.
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${HOMESPACE_DB_USER:-homespace}
      POSTGRES_PASSWORD: ${HOMESPACE_DB_PASSWORD:-homespace}
      POSTGRES_DB: homespace
    ports:
      - "127.0.0.1:${HOMESPACE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d homespace"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HOMESPACE_DB_USER:-homespace}:${HOMESPACE_DB_PASSWORD:-homespace}@db:5432/homespace
      HOMESPACE_JWT_SECRET: ${HOMESPACE_JWT_SECRET:-}
      HOMESPACE_JWT_SECRET_PREVIOUS: ${HOMESPACE_JWT_SECRET_PREVIOUS:-}
      HOMESPACE_PUBLIC_URL: ${HOMESPACE_PUBLIC_URL:-}
      HOMESPACE_OIDC_ISSUER: ${HOMESPACE_OIDC_ISSUER:-}
      HOMESPACE_OIDC_CLIENT_ID: ${HOMESPACE_OIDC_CLIENT_ID:-}
      HOMESPACE_OIDC_CLIENT_SECRET: ${HOMESPACE_OIDC_CLIENT_SECRET:-}
      HOMESPACE_OIDC_NAME: ${HOMESPACE_OIDC_NAME:-Single sign-on}
      HOMESPACE_OIDC_REQUIRED_GROUP: ${HOMESPACE_OIDC_REQUIRED_GROUP:-}
      HOMESPACE_PASSWORD_LOGIN: ${HOMESPACE_PASSWORD_LOGIN:-true}
      # true behind a reverse proxy that sets X-Forwarded-For, so sign-in throttling sees clients.
      HOMESPACE_TRUST_FORWARDED_FOR: ${HOMESPACE_TRUST_FORWARDED_FOR:-false}
      HOMESPACE_MAX_UPLOAD_BYTES: ${HOMESPACE_MAX_UPLOAD_BYTES:-10737418240}
      HOMESPACE_UPLOAD_CHUNK_BYTES: ${HOMESPACE_UPLOAD_CHUNK_BYTES:-33554432}
      HOMESPACE_UPLOAD_EXPIRY_HOURS: ${HOMESPACE_UPLOAD_EXPIRY_HOURS:-24}
      HOMESPACE_TRANSFER_TTL_HOURS: ${HOMESPACE_TRANSFER_TTL_HOURS:-24}
      HOMESPACE_USER_DELETION_DELAY_MINUTES: ${HOMESPACE_USER_DELETION_DELAY_MINUTES:-10}
      HOMESPACE_STORAGE: ${HOMESPACE_STORAGE:-local}
      # Shown on the administration page; the server listens on 8080 inside the container.
      HOMESPACE_PORT: ${HOMESPACE_PORT:-8080}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${HOMESPACE_PORT:-8080}:8080"
    volumes:
      - files:/data
    restart: unless-stopped

  # Optional Keycloak with a ready-made realm (user demo / demo) for trying single sign-on.
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./docs/keycloak/homespace-realm.json:/opt/keycloak/data/import/homespace-realm.json:ro,z

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${HOMESPACE_DB_USER:-homespace}:${HOMESPACE_DB_PASSWORD:-homespace}@db:5432/homespace
    working_dir: /workspace
    volumes:
      - .:/workspace:z
      - server-target:/workspace/server/target
      - clients-target:/workspace/clients/target
      - cargo-registry:/usr/local/cargo/registry

volumes:
  pgdata:
  files:
  server-target:
  clients-target:
  cargo-registry:
