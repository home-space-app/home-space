# Flatpak manifest for the desktop client. Build from the repository root with
#   clients/desktop/scripts/build-flatpak.sh
# cargo-sources.json lists the crates from clients/Cargo.lock, because flatpak-builder builds
# offline. It is generated, not committed: build-flatpak.sh and CI run
# clients/desktop/scripts/generate-flatpak-sources.sh first.
app-id: io.github.indomitable.home-space
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: home-space
finish-args:
  # The server, and the browser hand-off for single sign-on (loopback port).
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Sync folders are watched and changed in place, which the document portal cannot do.
  # Folders outside home (other disks under /media, /mnt) need an override, e.g. with Flatseal.
  - --filesystem=home
  # The session is kept in the Secret Service keyring (the build enables `keyring`).
  - --talk-name=org.freedesktop.secrets
modules:
  - name: home-space
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/home-space/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cd clients && cargo build --release --locked --offline -p desktop --features keyring
      - install -Dm755 clients/target/release/HomeSpace -t /app/bin/
      - install -Dm755 clients/desktop/packaging/flatpak/home-space.sh /app/bin/home-space
      - install -Dm644 clients/desktop/packaging/flatpak/io.github.indomitable.home-space.desktop
        -t /app/share/applications/
      - install -Dm644 clients/desktop/packaging/flatpak/io.github.indomitable.home-space.metainfo.xml
        -t /app/share/metainfo/
      - install -Dm644 clients/desktop/packaging/home-space.svg
        /app/share/icons/hicolor/scalable/apps/io.github.indomitable.home-space.svg
      - install -Dm644 clients/desktop/packaging/home-space.png
        /app/share/icons/hicolor/256x256/apps/io.github.indomitable.home-space.png
    sources:
      - type: dir
        path: ../../../..
        skip:
          # VCS data and the build state of flatpak-builder (CI builds from the repository root)
          - .git
          - .flatpak-builder
          - flatpak_app
          - repo
          - clients/target
          - server/target
          - shared/protocol/target
      - cargo-sources.json
