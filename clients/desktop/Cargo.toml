[package]
name = "desktop"
description = "Desktop client for a self-hosted Home Space server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "HomeSpace"
path = "src/main.rs"

[dependencies]
api-client.workspace = true
client-core.workspace = true
iced = { version = "0.14.0", features = ["advanced", "image-without-codecs", "svg", "tokio"] }
keyring = { version = "4.2.0", optional = true }
# The decoders behind iced's image widget: the types `src/viewers.rs` shows in the image viewer.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
notify = "8.2.1"
# Renders the pages of the PDF viewer.
pdf-core = { workspace = true, features = ["render"] }
open = "5.4.5"
png = "0.18.1"
rand = "0.10.3"
protocol.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rfd = "0.18.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sync-core.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
trash = "5.2.9"
uuid = { version = "1.29.0", features = ["v4"] }

[features]
# Keep the session in the system keyring (macOS Keychain, Secret Service, ...). Without it the
# session is a file under ~/.local/share/home-space, which unsigned dev builds can read without
# unlocking the keychain after every rebuild.
keyring = ["dep:keyring"]
# Lets the app be inspected: enables iced's devtools (F12 overlay) and reports to the `comet`
# debugger. Use comet's 0.14.0 tag to match iced 0.14:
#   cargo install --git https://github.com/iced-rs/comet --tag 0.14.0 && comet
#   cargo run -p desktop --features debug
debug = ["iced/debug"]

# macOS formats dates through Foundation instead (see src/locale.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
icu_datetime = "2.4.0"
icu_locale = "2.4.0"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSDate", "NSDateFormatter", "NSFormatter", "NSNotification", "NSOperation", "NSString"] }

[package.metadata.bundle]
name = "Home Space"
identifier = "io.github.indomitable.home-space"
icon = ["packaging/home-space.icns"]
category = "public.app-category.productivity"
short_description = "Browse and transfer your home-space files"

# Linux packages, built by the release workflow from an existing release build:
#   cargo build --release -p desktop --features keyring
#   cargo deb -p desktop --no-build
#   cargo generate-rpm -p desktop
# Paths are relative to this directory; cargo-deb and cargo-generate-rpm map target/release/ to
# the real target directory.
[package.metadata.deb]
name = "home-space"
maintainer = "Home Space developers"
copyright = "Home Space developers"
license-file = ["../../LICENSE", "0"]
extended-description = "Desktop client for a self-hosted Home Space server: browse, share and sync your files."
section = "net"
priority = "optional"
# winit and wgpu load these at runtime with dlopen, so $auto cannot see them.
depends = "$auto, libxkbcommon0"
recommends = "libwayland-client0, libxkbcommon-x11-0, libvulkan1 | libegl1"
assets = [
    ["target/release/HomeSpace", "usr/bin/", "755"],
    ["packaging/home-space.desktop", "usr/share/applications/", "644"],
    # Every size from scripts/render-icons.sh: KDE ignores the icon when only 256x256 is there.
    ["packaging/icons/hicolor/16x16/apps/home-space.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["packaging/icons/hicolor/22x22/apps/home-space.png", "usr/share/icons/hicolor/22x22/apps/", "644"],
    ["packaging/icons/hicolor/24x24/apps/home-space.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["packaging/icons/hicolor/32x32/apps/home-space.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["packaging/icons/hicolor/48x48/apps/home-space.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/hicolor/64x64/apps/home-space.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["packaging/icons/hicolor/128x128/apps/home-space.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/hicolor/256x256/apps/home-space.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/icons/hicolor/512x512/apps/home-space.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["packaging/home-space.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "home-space"
summary = "Desktop client for a self-hosted Home Space server"
assets = [
    { source = "target/release/HomeSpace", dest = "/usr/bin/HomeSpace", mode = "755" },
    { source = "packaging/home-space.desktop", dest = "/usr/share/applications/home-space.desktop", mode = "644" },
    { source = "packaging/icons/hicolor/16x16/apps/home-space.png", dest = "/usr/share/icons/hicolor/16x16/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/22x22/apps/home-space.png", dest = "/usr/share/icons/hicolor/22x22/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/24x24/apps/home-space.png", dest = "/usr/share/icons/hicolor/24x24/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/32x32/apps/home-space.png", dest = "/usr/share/icons/hicolor/32x32/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/48x48/apps/home-space.png", dest = "/usr/share/icons/hicolor/48x48/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/64x64/apps/home-space.png", dest = "/usr/share/icons/hicolor/64x64/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/128x128/apps/home-space.png", dest = "/usr/share/icons/hicolor/128x128/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/256x256/apps/home-space.png", dest = "/usr/share/icons/hicolor/256x256/apps/home-space.png", mode = "644" },
    { source = "packaging/icons/hicolor/512x512/apps/home-space.png", dest = "/usr/share/icons/hicolor/512x512/apps/home-space.png", mode = "644" },
    { source = "packaging/home-space.svg", dest = "/usr/share/icons/hicolor/scalable/apps/home-space.svg", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/home-space/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"

[dev-dependencies]
iced_test = "0.14.0"
pdf-core = { workspace = true, features = ["render", "sample"] }
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
wiremock = "0.6.5"
