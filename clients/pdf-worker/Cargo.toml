[package]
name = "pdf-worker"
description = "Renders PDF pages for the web client, in a web worker fetched the first time a PDF is opened"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
pdf-core = { workspace = true, features = ["render"] }
wasm-bindgen = "0.2.130"

[dependencies.web-sys]
version = "0.3.107"
features = ["DedicatedWorkerGlobalScope", "MessageEvent", "WorkerGlobalScope"]
