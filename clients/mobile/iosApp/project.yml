# XcodeGen spec for the iOS app; generate the project with `xcodegen generate` in this folder.
# The .xcodeproj is not committed, so there is no project.pbxproj to merge.
name: iosApp
options:
  bundleIdPrefix: app.homespace
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "2"
aggregateTargets:
  # Builds clients/mobile-core (the Rust client) into an xcframework and generates its Swift
  # bindings.
  RustCore:
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Compile Rust core
        basedOnDependencyAnalysis: false
        script: |
          profile=mobile
          [ "$CONFIGURATION" = Debug ] && profile=debug
          "$SRCROOT/../../mobile-core/scripts/build-ios.sh" "$profile"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # Also built into the extensions.
      - Shared
      # Swift bindings generated by clients/mobile-core/scripts/build-ios.sh.
      - path: ../build/rust-core/ios/swift
        group: RustCore
    dependencies:
      # Built first, so the xcframework is not rewritten while this target reads it.
      - target: RustCore
      # Static libraries, so nothing is embedded.
      - framework: ../build/rust-core/ios/HomeSpaceCore.xcframework
        embed: false
      - target: ShareExtension
      - target: FileProviderExtension
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Home Space
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain HTTP only to local addresses, for a dev server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Shown when the app first connects to a server on the LAN (devices only).
        NSLocalNetworkUsageDescription: Home Space connects to your Home Space server on the local network.
        NSPhotoLibraryUsageDescription: Home Space uploads the photos and videos you choose to your server.
        # Files received from other devices are kept in Documents/Received, which Files shows under
        # On My iPhone › Home Space. Everything private stays in Application Support.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lets SessionStore name the Keychain group it shares with the extensions.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # Sync in background; the identifiers are in SyncRunner.swift.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - app.homespace.ios.sync-refresh
          - app.homespace.ios.sync-processing
          - app.homespace.ios.uploads.*
    # The App Group and Keychain group the app shares with its extensions (SessionStore.swift).
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.homespace
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.homespace.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios
        GENERATE_INFOPLIST_FILE: NO
  # Save or send what another app shares (ShareExtension/ShareModel.swift). It signs in with a
  # session of its own, which the app starts for it (iosApp/ExtensionSessions.swift).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      # The file icons and colours.
      - path: iosApp/Assets.xcassets
        buildPhase: resources
      - path: ../build/rust-core/ios/swift
        group: RustCore
    dependencies:
      - target: RustCore
      - framework: ../build/rust-core/ios/HomeSpaceCore.xcframework
        embed: false
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Home Space
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Home Space connects to your Home Space server on the local network.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The same limits as a pick in the app.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.homespace
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.homespace.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios.share
        GENERATE_INFOPLIST_FILE: NO
        # Only the app has an icon of its own.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  # Home Space in Files and in other apps' file pickers (FileProviderExtension). It signs in with
  # a session of its own, like the share extension; the app adds its domain while signed in
  # (iosApp/FileProviderDomains.swift).
  FileProviderExtension:
    type: app-extension
    platform: iOS
    sources:
      - FileProviderExtension
      - Shared/SessionStore.swift
      - path: ../build/rust-core/ios/swift
        group: RustCore
    dependencies:
      - target: RustCore
      - framework: ../build/rust-core/ios/HomeSpaceCore.xcframework
        embed: false
    info:
      path: FileProviderExtension/Info.plist
      properties:
        CFBundleDisplayName: Home Space
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Home Space connects to your Home Space server on the local network.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.app.homespace
    entitlements:
      path: FileProviderExtension/FileProviderExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.homespace
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.homespace.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios.files
        GENERATE_INFOPLIST_FILE: NO
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.homespace.ios.uitests
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppUITests
