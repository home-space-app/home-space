[package]
name = "mobile-core"
description = "The Rust api-client and client-core exported to Kotlin and Swift through UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .so Android loads through JNA. staticlib: linked into the iOS app.
# lib: for `cargo test` and the bindgen binary.
crate-type = ["lib", "cdylib", "staticlib"]
name = "homespace_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
api-client.workspace = true
client-core.workspace = true
futures = "0.3"
hex = "0.4.3"
protocol.workspace = true
rand = "0.10.3"
reqwest.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde_json.workspace = true
sha2.workspace = true
sync-core.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
uniffi = "0.32.2"
url = "2"
uuid = { version = "1.29.0", features = ["v4"] }

# Android's certificate checks run in the JVM, so the verifier needs a handle on it (see `android`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6.5"
