<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files — account menu, not an admin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="web.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="hs app {{cls}}" style="min-height: 900px">
  <nav class="side" aria-label="Places" style="z-index: 6">
    <div class="logo"><span class="tile"><span class="ic fill sm" aria-hidden="true">home</span></span><span class="brand">Home Space</span></div>
    <a class="nav on" href="Main.dc.html" aria-current="page"><span class="ic fill" aria-hidden="true">folder</span>Files</a>
    <a class="nav" href="#"><span class="ic" aria-hidden="true">delete</span>Recycle bin</a>
    <div class="foot">
      <a class="storage" href="SettingsAccount.dc.html">
        <span style="display: flex; align-items: center; gap: 8px"><span class="ic sm muted" aria-hidden="true">hard_drive</span><span class="label">Storage</span></span>
        <span class="bar" aria-hidden="true"><i style="width: 62%"></i></span>
        <span class="small muted num">31.0 GB of 50.0 GB used</span>
      </a>
      <button class="account open" type="button" aria-haspopup="menu" aria-expanded="true">
        <span class="avatar alt">M</span>
        <span class="who"><span>maria</span></span>
        <span class="ic sm muted" aria-hidden="true">unfold_more</span>
      </button>
    </div>

    <div class="menu" role="menu" aria-label="Account" style="left: 12px; bottom: 64px; width: 264px">
      <div class="mh">
        <span class="avatar alt">M</span>
        <span style="display: flex; flex-direction: column; line-height: 1.3; min-width: 0"><span class="label">maria</span><span class="small muted">Signed in with Keycloak</span></span>
      </div>
      <div class="sep-h"></div>
      <a class="mi" href="SettingsAccount.dc.html" role="menuitem"><span class="ic" aria-hidden="true">settings</span>Settings</a>
      <div class="sep-h"></div>
      <button class="mi hover" type="button" role="menuitem"><span class="ic" aria-hidden="true">logout</span>Log out</button>
    </div>
  </nav>

  <main class="main">
    <div class="top">
      <nav class="crumbs" aria-label="Folder path"><span class="cur" aria-current="page">Home</span></nav>
      <label class="search"><span class="ic sm" aria-hidden="true">search</span><input placeholder="Search files and folders" aria-label="Search files and folders"><span class="kbd">Ctrl K</span></label>
    </div>
    <div class="toolbar">
      <button class="btn primary" type="button"><span class="ic sm" aria-hidden="true">upload</span>Upload files</button>
      <button class="btn ghost" type="button"><span class="ic sm" aria-hidden="true">create_new_folder</span>New folder</button>
    </div>

    <div class="box" role="table" aria-label="Home">
      <div class="thead" role="row">
        <span class="cb" role="checkbox" aria-checked="false" aria-label="Select all"></span>
        <span class="overline" role="columnheader" aria-sort="ascending">Name ↑</span>
        <span class="overline r" role="columnheader">Size</span>
        <span class="overline r" role="columnheader">Modified</span>
        <span></span>
      </div>
      <div class="tr" role="row"><span class="cb" aria-hidden="true"></span><div class="name"><span class="ic fill folder" aria-hidden="true">folder</span><span class="nm"><span>Photos</span></span></div><span class="r"></span><span class="r">6 Nov 2026, 18:40</span><button class="icon-btn" type="button" aria-label="Actions for Photos"><span class="ic" aria-hidden="true">more_horiz</span></button></div>
      <div class="tr" role="row"><span class="cb" aria-hidden="true"></span><div class="name"><span class="ic fill folder" aria-hidden="true">folder</span><span class="nm"><span>Recipes</span></span></div><span class="r"></span><span class="r">2 Nov 2026, 12:10</span><button class="icon-btn" type="button" aria-label="Actions for Recipes"><span class="ic" aria-hidden="true">more_horiz</span></button></div>
      <div class="tr" role="row"><span class="cb" aria-hidden="true"></span><div class="name"><span class="ic" aria-hidden="true">description</span><span class="nm"><span>tax-return-2025.pdf</span></span></div><span class="r">1.1 MB</span><span class="r">30 Oct 2026, 16:22</span><button class="icon-btn" type="button" aria-label="Actions for tax-return-2025.pdf"><span class="ic" aria-hidden="true">more_horiz</span></button></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { cls: this.props.dark ? 'dark' : '' }; }
}
</script>
</body>
</html>
