# Server override: keeps the database and the blobs in directories you choose and runs both
# containers as one dedicated host user, so only that user can read the files.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Required variables (put them in a .env next to this file, see "Compose" in the README):
#   HOMESPACE_DB_DIR     host directory for the Postgres files, e.g. /srv/homespace/db
#   HOMESPACE_DATA_DIR   host directory for the blobs,          e.g. /srv/homespace/files
#   HOMESPACE_UID        numeric uid of the owning host user (id -u homespace)
#   HOMESPACE_GID        numeric gid of the owning host user (id -g homespace)
#   HOMESPACE_DB_PASSWORD  password of the database user; the development default is not
#                          accepted here. Postgres takes it when the database directory is
#                          first created: for an existing one, give the password it was
#                          created with, or change it there first (ALTER USER ... PASSWORD).
#   HOMESPACE_JWT_SECRET   signs the access tokens (openssl rand -base64 48)
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${HOMESPACE_DB_PASSWORD:?set HOMESPACE_DB_PASSWORD}
    user: "${HOMESPACE_UID:?set HOMESPACE_UID}:${HOMESPACE_GID:?set HOMESPACE_GID}"
    volumes:
      - ${HOMESPACE_DB_DIR:?set HOMESPACE_DB_DIR}:/var/lib/postgresql
      # Postgres looks its running user up by uid; an arbitrary uid has no passwd entry in the image.
      - /etc/passwd:/etc/passwd:ro

  app:
    environment:
      DATABASE_URL: postgres://${HOMESPACE_DB_USER:-homespace}:${HOMESPACE_DB_PASSWORD:?set HOMESPACE_DB_PASSWORD}@db:5432/homespace
      HOMESPACE_JWT_SECRET: ${HOMESPACE_JWT_SECRET:?set HOMESPACE_JWT_SECRET}
    user: "${HOMESPACE_UID:?set HOMESPACE_UID}:${HOMESPACE_GID:?set HOMESPACE_GID}"
    volumes:
      - ${HOMESPACE_DATA_DIR:?set HOMESPACE_DATA_DIR}:/data
